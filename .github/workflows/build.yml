name: Build Flet APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flet-dev/flet-build-action@v1
        with:
          target: apk
      - uses: actions/upload-artifact@v4
        with:
          name: mi-excel-apk
          path: build/apk/*.apk
